<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="900" height="190" rx="16" fill="#0a1226"/><text x="450" y="30" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#d6e8f7">What the stego image holds, in the order it is written</text><rect x="20" y="58" width="116" height="64" rx="8" fill="#8fa5c4"/><text x="78.0" y="95" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#071022">BMP header</text><text x="78.0" y="148" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="500" fill="#8fa5c4">54 B</text><rect x="140" y="58" width="66" height="64" rx="8" fill="#ffb347"/><text x="173.0" y="95" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#071022">Magic</text><text x="173.0" y="148" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="500" fill="#8fa5c4">16 bytes</text><rect x="210" y="58" width="86" height="64" rx="8" fill="#4aa8ff"/><text x="253.0" y="95" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#071022">Ext size</text><text x="253.0" y="148" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="500" fill="#8fa5c4">32 bytes</text><rect x="300" y="58" width="92" height="64" rx="8" fill="#9be15d"/><text x="346.0" y="95" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#071022">Extension</text><text x="346.0" y="148" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="500" fill="#8fa5c4">n x 8</text><rect x="396" y="58" width="86" height="64" rx="8" fill="#4aa8ff"/><text x="439.0" y="95" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#071022">File size</text><text x="439.0" y="148" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="500" fill="#8fa5c4">32 bytes</text><rect x="486" y="58" width="246" height="64" rx="8" fill="#ffb347"/><text x="609.0" y="95" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#071022">Secret data</text><text x="609.0" y="148" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="500" fill="#8fa5c4">size x 8</text><rect x="736" y="58" width="126" height="64" rx="8" fill="#3b5075"/><text x="799.0" y="95" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#071022">Rest of image</text><text x="799.0" y="148" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="500" fill="#8fa5c4">unchanged</text><rect x="20" y="52" width="26" height="76" rx="8" fill="#fff" opacity=".35"><animate attributeName="x" values="20;820;20" dur="9s" repeatCount="indefinite"/></rect><text x="450" y="178" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="500" fill="#8fa5c4">each data byte takes 8 image bytes, one bit per byte</text></svg>